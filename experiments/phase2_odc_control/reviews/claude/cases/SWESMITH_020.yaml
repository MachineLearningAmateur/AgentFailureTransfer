reasoning_summary: >-
  The bug diff deletes the "-f/--force" subparser argument from remote_add and replaces
  "remotes.add(r, force=args.force, index=args.index)" with a bare add followed by a separate
  move call; the only change in remotes.py is a trailing newline, so the duplicate-URL checking
  code itself is untouched and merely never receives force. The reference repair restores the
  option and the parameterized call. The defect is the command-line surface exposed to the user
  and the arguments crossing from the CLI into the remotes API, matching the duplicate-name,
  duplicate-url and insert tests.
