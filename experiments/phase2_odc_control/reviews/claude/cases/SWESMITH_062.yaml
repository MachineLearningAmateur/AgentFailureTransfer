reasoning_summary: >-
  The bug diff replaces three "- 1" offsets with "- 0" in the tokenizer's delimited-text scan:
  the advance past a multi-character delimiter, the start index recorded before advancing, and
  the end bound of the slice appended to text. The reference repair restores each offset. Because
  one of them sits in an assignment, ASSIGNMENT is arguable, but the defect is index arithmetic in
  the scanning loop, so rule 6 selects ALGORITHM.
